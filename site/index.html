<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>УМГ «Уральск» — Интергаз Центральная Азия · 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090f'/><circle cx='16' cy='16' r='7' fill='%2300f5ff'/></svg>" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <style>
    :root {
      --bg: #09090f;
      --glass: rgba(10, 12, 20, 0.64);
      --glass-strong: rgba(10, 12, 20, 0.82);
      --border: rgba(255, 255, 255, 0.13);
      --border-hi: rgba(255, 255, 255, 0.24);
      --text: #f3f5fa;
      --muted: rgba(243, 245, 250, 0.62);
      --accent: #00f5ff;
      --accent-soft: rgba(0, 245, 255, 0.14);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
    }

    #viewport {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      cursor: grab;
    }
    #viewport:active { cursor: grabbing; }

    /* Preloader */
    #loader {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--bg);
      transition: opacity 0.4s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .loader-mark {
      font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text); font-weight: 600;
    }
    .loader-bar {
      width: 140px; height: 2px; background: rgba(255,255,255,0.12); overflow: hidden; border-radius: 2px;
    }
    .loader-bar::after {
      content: ""; display: block; width: 45%; height: 100%;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    /* HUD shell */
    .hud {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 18px 22px;
    }
    .hud-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .hud-bottom {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }

    .glass {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
    }

    /* Title badge */
    .brand {
      padding: 10px 14px;
      display: flex; align-items: center; gap: 11px;
    }
    .brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.7);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.04em; line-height: 1.2;
    }
    .brand-sub {
      font-size: 11px; color: var(--muted); letter-spacing: 0.02em; margin-top: 2px;
    }

    /* Top-right toolbar */
    .top-tools {
      display: flex; align-items: center; gap: 8px;
    }
    .seg {
      display: inline-flex; padding: 3px; gap: 2px;
    }
    .seg button, .icon-btn, .dock-btn {
      appearance: none; border: 1px solid transparent; background: transparent;
      color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 6px 11px; border-radius: 8px; cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
      white-space: nowrap;
    }
    .seg button:hover, .icon-btn:hover, .dock-btn:hover {
      color: var(--text); background: rgba(255, 255, 255, 0.06);
    }
    .seg button.active, .dock-btn.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: rgba(0, 245, 255, 0.36);
    }
    .icon-btn {
      padding: 7px 10px; font-size: 11px; letter-spacing: 0.06em; color: var(--text);
    }

    /* Bottom dock */
    .dock {
      display: flex; align-items: center; gap: 6px; padding: 5px;
      max-width: calc(100vw - 24px);
    }
    .dock-sep {
      width: 1px; height: 20px; background: var(--border); margin: 0 2px; flex-shrink: 0;
    }
    .views {
      display: flex; align-items: center; gap: 2px;
    }

    /* Compact help strip */
    .help-card {
      padding: 7px 13px; font-size: 11.5px; color: var(--muted);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .help-card b { color: var(--text); font-weight: 600; }
    .help-card.hidden { opacity: 0; pointer-events: none; transform: translateY(6px); }

    /* Mobile virtual pad (shown only in Human mode on mobile) */
    #mobile-pad {
      display: none; pointer-events: auto;
      position: fixed; left: 18px; bottom: 108px; z-index: 15;
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(10, 12, 20, 0.55);
      border: 1px solid var(--border-hi);
      backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
    }
    #mobile-pad.visible { display: flex; }
    .pad-knob {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(0, 245, 255, 0.28);
      border: 1px solid rgba(0, 245, 255, 0.7);
      pointer-events: none;
    }

    /* Mobile 390x844 layout */
    @media (max-width: 640px) {
      .hud { padding: 12px 12px 14px; }
      .hud-top { flex-direction: column; align-items: stretch; gap: 8px; }
      .brand { padding: 8px 11px; }
      .brand-title { font-size: 12px; }
      .brand-sub { font-size: 10.5px; }
      .top-tools { justify-content: space-between; }
      .seg button { padding: 6px 9px; font-size: 11.5px; }
      .dock {
        flex-wrap: wrap; justify-content: center; gap: 4px; padding: 6px;
        width: 100%;
      }
      .dock-sep { display: none; }
      .views {
        width: 100%; justify-content: space-between;
        overflow-x: auto; scrollbar-width: none; padding-top: 2px;
        border-top: 1px solid var(--border);
      }
      .views::-webkit-scrollbar { display: none; }
      .dock-btn { padding: 6px 8px; font-size: 11px; }
      .help-card { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="loader">
    <div class="loader-mark">УМГ «Уральск» · 3D</div>
    <div class="loader-bar"></div>
  </div>

  <div class="hud">
    <div class="hud-top">
      <div class="brand glass">
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <div class="brand-title">УМГ «Уральск»</div>
          <div class="brand-sub">Интергаз Центральная Азия</div>
        </div>
      </div>

      <div class="top-tools">
        <div class="seg glass" role="group" aria-label="Время суток">
          <button type="button" data-time="day" class="active">День</button>
          <button type="button" data-time="golden">Закат</button>
          <button type="button" data-time="night">Ночь</button>
        </div>
        <button type="button" id="btn-quality" class="icon-btn glass">HD</button>
        <button type="button" id="btn-help" class="icon-btn glass" aria-label="Подсказка">?</button>
      </div>
    </div>

    <div class="hud-bottom">
      <div id="help-card" class="help-card glass">
        <span id="help-text"><b>Дрон:</b> WASD — пролёт · Q/E — высота · Shift — быстрее · Мышь — обзор · Колесо — зум</span>
      </div>

      <div class="dock glass">
        <div class="seg" role="group" aria-label="Режим камеры">
          <button type="button" data-mode="drone" class="active">Дрон</button>
          <button type="button" data-mode="human">Человек</button>
        </div>
        <button type="button" id="btn-tour" class="dock-btn">Облёт</button>
        <span class="dock-sep" aria-hidden="true"></span>
        <div class="views" role="group" aria-label="Точки обзора">
          <button type="button" class="dock-btn active" data-view="facade">Фасад</button>
          <button type="button" class="dock-btn" data-view="lobby">Холл · Охрана</button>
          <button type="button" class="dock-btn" data-view="lift">Лифт · Лестницы</button>
          <button type="button" class="dock-btn" data-view="hall">Актовый зал</button>
          <button type="button" class="dock-btn" data-view="meeting">Переговорная</button>
          <button type="button" class="dock-btn" data-view="dispatch">Диспетчерская</button>
          <button type="button" class="dock-btn" data-view="aerial">Сверху</button>
        </div>
      </div>
    </div>
  </div>

  <div id="mobile-pad" aria-label="Джойстик движения">
    <div class="pad-knob"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
